name: Deploy Pull Request Preview

on:
  pull_request:
    branches:
      - Combined
    types:
      - opened
      - synchronize
      - reopened
      - closed
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to deploy
        required: true
        type: number
      head_sha:
        description: Pull request head commit SHA to deploy
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: stylewithkayla-preview-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
  WORKER_NAME: stylewithkayla-pr-${{ github.event.pull_request.number || inputs.pr_number }}

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.head_sha }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run event-focused tests
        run: >-
          node --import tsx --test
          tests/event-editor-client.test.ts
          tests/event-management.test.ts
          tests/public-events.test.ts

      - name: Run tests
        run: npm test

      - name: Build production artifact
        run: npm run build

      - name: Apply preview database migrations
        run: >-
          npx wrangler d1 migrations apply stylewithkayla-preview
          --remote
          --config wrangler.preview.jsonc

      - name: Deploy preview Worker
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          output_file="$(mktemp)"
          npx wrangler deploy \
            --config wrangler.preview.jsonc \
            --name "$WORKER_NAME" 2>&1 | tee "$output_file"

          preview_url="$(sed -r 's/\x1B\[[0-9;]*[mK]//g' "$output_file" \
            | grep -Eo 'https://[^[:space:]]+\.workers\.dev' \
            | tail -n 1)"
          if [ -z "$preview_url" ]; then
            echo "Wrangler did not report a workers.dev URL." >&2
            exit 1
          fi
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Add or update preview comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          DEPLOYED_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- stylewithkayla-cloudflare-preview -->';
            const url = process.env.PREVIEW_URL;
            const body = `${marker}
            ## Cloudflare PR preview

            **Deployment status:** ✅ Ready
            **Commit:** \`${process.env.DEPLOYED_SHA}\`
            **Preview URL:** ${url}

            Manual test links:
            - [Home](${url}/)
            - [Events](${url}/events)
            - [Admin events](${url}/admin/events)
            - [Create event](${url}/admin/events/new)

            Preview Workers share the \`stylewithkayla-preview\` D1 database and preview R2 bucket. Admin links require Cloudflare Access.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  cleanup:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out base repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Delete preview Worker
        run: >-
          npx wrangler delete
          --config wrangler.preview.jsonc
          --name "$WORKER_NAME"
          --force

      - name: Update preview comment
        if: always()
        uses: actions/github-script@v8
        env:
          CLEANUP_RESULT: ${{ job.status }}
        with:
          script: |
            const marker = '<!-- stylewithkayla-cloudflare-preview -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (!existing) return;
            const succeeded = process.env.CLEANUP_RESULT === 'success';
            const body = `${marker}
            ## Cloudflare PR preview

            **Deployment status:** ${succeeded ? '🧹 Removed' : '❌ Cleanup failed'}
            **Worker:** \`${process.env.WORKER_NAME}\`

            ${succeeded
              ? 'The pull request is closed and its Worker has been deleted. Shared preview D1 and R2 resources were preserved.'
              : 'The pull request is closed, but Worker cleanup failed. Review this workflow run; production resources were not modified.'}`;
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: existing.id,
              body,
            });
